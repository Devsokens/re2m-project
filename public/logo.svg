<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001B48"/>
      <stop offset="50%" stop-color="#002366"/>
      <stop offset="100%" stop-color="#081026"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE8A6"/>
      <stop offset="50%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#9A7B2C"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer background circle with border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.7" />

  <!-- Geometric diamond shield emblem -->
  <g transform="translate(256, 220) scale(1.1)">
    <!-- Outer gold accent diamond -->
    <path d="M 0 -110 L 100 0 L 0 110 L -100 0 Z" fill="none" stroke="url(#goldGrad)" stroke-width="8" filter="url(#goldGlow)"/>
    <!-- Inner diamond -->
    <path d="M 0 -85 L 75 0 L 0 85 L -75 0 Z" fill="#002366" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <!-- Monogram RE2M -->
    <text x="0" y="24" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">
      RE2M
    </text>
  </g>

  <!-- Subtitle -->
  <text x="256" y="420" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">
    CONNECT
  </text>
  <text x="256" y="452" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#C9A84C" text-anchor="middle" letter-spacing="3">
    CABINET RE2M
  </text>
</svg>
